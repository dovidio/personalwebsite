baseURL = "https://umberto.xyz/"
languageCode = "en-us"
title = "Umberto D'Ovidio"
theme = "zenith"
defaultContentLanguage = "en"
copyright = "© 2026 Umberto D'Ovidio"


enableRobotsTXT = true

[Params]
  favicon = "img/favicon.ico"
  description = "Dad and software crafter. Tools I build for myself, and notes on the ones that shipped."
  dateFormat = "2 January 2006"
  mainSections = ["post"]
  readingTime = true
  wordCount = true

[languages]
  [languages.en]
    contentDir = "content/en" # English
    flagName = "gb" 
    LanguageName = "English"
  [languages.it] 
    contentDir = "content/it" # Italian
    flagName = "it"
    LanguageName = "Italiano"

[[menu.main]]
    name = "Blog"
    url = "/"
    weight = 1

[languages.en.menu]
  [[languages.en.menu.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 2

[languages.it.menu]
  [[languages.it.menu.main]]
    name = "RSS"
    url = "/it/index.xml"
    weight = 2
    


[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    style = 'github'
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
    tabWidth = 2
    useClasses = true

[outputs]
  # Ensure the homepage generates an RSS feed
  home = ["HTML", "RSS"]
